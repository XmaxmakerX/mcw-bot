name: Daily MCW Components Update

on:
  schedule:
        # 00:00 по Москве = 21:00 UTC предыдущего дня
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywikibot requests

      - name: Copy family file to pywikibot package
        run: |
          python -c "import pywikibot, os, shutil; pkg_dir = os.path.dirname(pywikibot.__file__); shutil.copy('mcw_family.py', os.path.join(pkg_dir, 'families', 'mcw_family.py'))"

      - name: Create user-config.py
        run: |
          cat > user-config.py << 'EOF'
          family = 'mcw'
          mylang = 'ru'
          usernames['mcw']['ru'] = 'XmaxmakerXBot'
          password_file = "user-password.py"
          EOF

      - name: Create user-password.py
        env:
          PYWIKIBOT_PASSWORD: ${{ secrets.PYWIKIBOT_PASSWORD }}
        run: |
          echo "('XmaxmakerXBot', BotPassword('pywiki', '${PYWIKIBOT_PASSWORD}'))" > user-password.py
          chmod 600 user-password.py

      - name: Run update script
        run: python scripts/update_components.py
