name: Daily MCW Updates

on:
  schedule:
    # Запуск каждый день в 00:00 по мск
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywikibot requests

      - name: Create family file
        run: |
          cat > rumcw_family.py << 'EOF'
          from pywikibot import family

          class Family(family.Family):
              name = 'rumcw'
              langs = {
                  'ru': 'ru.minecraft.wiki',
              }

              def scriptpath(self, code):
                  return ''

              def protocol(self, code):
                  return 'HTTPS'
          EOF

      - name: Create user-config.py
        run: |
          cat > user-config.py << 'EOF'
          family = 'rumcw'
          mylang = 'ru'
          usernames['rumcw']['ru'] = 'XmaxmakerXBot'
          password_file = "user-password.py"
          EOF

      - name: Create user-password.py
        env:
          PYWIKIBOT_PASSWORD: ${{ secrets.PYWIKIBOT_PASSWORD }}
        run: |
          echo "('XmaxmakerXBot', BotPassword('pywiki', '${PYWIKIBOT_PASSWORD}'))" > user-password.py
          chmod 600 user-password.py

      - name: Run update script
        env:
          PYWIKIBOT_PASSWORD: ${{ secrets.PYWIKIBOT_PASSWORD }}
        run: python update_components.py
